name: Docker Deploy

on:
  push:
    branches:
      - master
      - Task-*

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Подготовка окружения
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 2. Git Hub : Аутентификация
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    # 3. Git Hub : Отправка контейнер из Git Hub на Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./src/Example-Web-Deploy
        push: true
        tags: gorbatukam/example-web-deploy:latest

    # 4. Server : SSH 
    - name: Setup SSH directory
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Add host to known_hosts
      run: ssh-keyscan 89.169.10.160 >> ~/.ssh/known_hosts

    - name: Create remote app directory
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "mkdir -p /opt/app"

    # 5. Миграции : Сборка
    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef #--version 8.0.0

    - name: Build migrations bundle
      run: |
        dotnet ef migrations bundle \
          --project ./src/Example-Web-Deploy/Datasource.Ef/Datasource.Ef.csproj \
          --startup-project ./src/Example-Web-Deploy/Client.WebMvc/Client.WebMvc.csproj \
          --output efbundle \
          --verbose
        chmod +x efbundle

    # 6. Server : Копирование файлов
    - name: Copy compose files
      run: scp -o StrictHostKeyChecking=no ./src/Example-Web-Deploy/docker-compose.yml root@89.169.10.160:/opt/app/

    - name: Copy nginx config
      run: scp -o StrictHostKeyChecking=no ./src/Example-Web-Deploy/nginx.conf root@89.169.10.160:/opt/app/

    - name: Copy appsettings
      run: scp -o StrictHostKeyChecking=no ./src/Example-Web-Deploy/Client.WebMvc/appsettings.json root@89.169.10.160:/opt/app/

    - name: Copy migrations bundle
      run: scp -o StrictHostKeyChecking=no ./efbundle root@89.169.10.160:/opt/app/

    # 7. Деплой : Контейнеры. Очистка старых, получение из Docker Hub на Server новых, сборка. 
    - name: Validate compose file
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "cd /opt/app && docker-compose config -q"

    - name: Stop containers
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "cd /opt/app && docker-compose down --remove-orphans --timeout 30 || true"

    - name: Clean unused images
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "docker image prune -a -f"

    - name: Update images
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "cd /opt/app && docker-compose pull"

    - name: Start services
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "cd /opt/app && docker-compose up -d --no-build" # / --no-build / --no-recreate /

    - name: Verify deployment
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "cd /opt/app && docker-compose ps --services | xargs -I{} docker-compose ps {} | grep -q 'Up'"

    # 8. Миграции : Применение и очистка
    - name: Wait for PostgreSQL
      run: |
        ssh -o StrictHostKeyChecking=no root@89.169.10.160 << 'EOF'
        for i in {1..30}; do
          if docker exec web-deploy-postgres pg_isready -h localhost -U postgres -d WebDeploy; then
            echo "PostgreSQL ready!"
            exit 0
          fi
          sleep 2
          echo "Attempt $i: Waiting for PostgreSQL..."
        done
        echo "PostgreSQL not ready after 30 attempts!"
        exit 1
        EOF

    - name: Prepare migration environment
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "docker exec web-deploy-client mkdir -p /app/migrations"

    - name: Copy bundle to container
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "docker cp /opt/app/efbundle web-deploy-client:/app/migrations/"

    - name: Copy appsettings to container
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "docker cp /opt/app/appsettings.json web-deploy-client:/app/"

    - name: Apply migrations
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "docker exec web-deploy-client /app/migrations/efbundle"

    - name: Cleanup remote
      run: ssh -o StrictHostKeyChecking=no root@89.169.10.160 "rm -f /opt/app/efbundle"

    - name: Cleanup local
      run: rm -f efbundle